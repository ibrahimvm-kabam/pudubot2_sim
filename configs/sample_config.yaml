# Copy this file to config.yaml (or mount your own file at that path) before running.
robot_name: "Hiro"
port: 7896

initial_state:
  map: "L8"
  pose:
    x: 3.07
    y: 9.28
    theta: 0
  battery: 100 # 0-100, matches the real adapter's /battery/level scale

navigation_speed_m_per_s: 0.4 # matches fleet_adapter_pudu's configured linear velocity limit for this robot

battery:
  drain_percent_per_meter: 0.1 # drained while moving
  charge_percent_per_second: 1.0 # gained while docked
  docking_seconds: 2 # time from arriving at the charger to ChargingStatus: true

localization:
  delay_seconds: 2 # time a /localization/by_* request takes to complete

user_interaction:
  # Simulated "Done" tap on the delivery tablet, this long after the adapter sets
  # user_acknowledgment=true. Omit to wait for `POST /sim/acknowledge` instead.
  auto_acknowledge_seconds: 5

sim_api: true # expose the /sim/* fault-injection endpoints

# Waypoint coordinates below are a small sample drawn from the real
# M_Hotel deployment's per-floor waypoint data, for a realistic default.
maps:
  L8:
    charger_waypoint: "Charging Dock"
    waypoints:
      - id: "Charging Dock"
        x: -6.3605
        y: 15.985
        theta: -0.58116
      - id: "Reception"
        x: 4.56
        y: 12.94
        theta: -2.15
      - id: "Meeting1"
        x: -2.28
        y: 2.99
        theta: 1
      - id: "L8_lift9_holding"
        x: 3.07
        y: 9.28
        theta: 1
  L9:
    waypoints:
      - id: "L9_lift9_holding"
        x: 6.2
        y: 17.33
        theta: 0.9
      - id: "L9_lift1_inside"
        x: -2.75
        y: -2.61
        theta: 0.43
      - id: "R"
        x: -1.67
        y: 1.16
        theta: -0.59
