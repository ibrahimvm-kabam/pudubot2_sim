# Copy this file to config.yaml (or mount your own file at that path) before running.
robot_name: "Hiro"
port: 7896

initial_state:
  map: "L8"
  pose:
    x: 3.07
    y: 9.28
    theta: 0
  battery: 100 # 0-100, matches the real adapter's /battery/level scale

# Directory the building's floorplan scans are mounted into (read-only),
# see the docker run / docker-compose examples in the README.
floorplans_dir: "/app/floorplans"

# Waypoint lists (map management) are added to these entries in a later PR.
maps:
  L8:
    floorplan:
      file: "M Hotel Floor Plan_L8_page-0001.png"
      # Seeded from fleet_adapter_pudu/configs/config.yaml's
      # transforms.L8 block, which calibrates the pre-built robot map for
      # this level, not this raw floorplan scan (different pixel scale) -
      # treat these as a starting point and recalibrate for the real scan.
      resolution: 0.05 # meters per pixel
      origin:
        x: -29.264883
        y: -34.901213
      rotation: 0 # degrees, applied before thresholding
      # Strips thin dimension/gridlines that would otherwise cut through
      # corridors in the occupancy grid. 3 is a light touch that works for
      # this scan; re-tune per floorplan (see build_occupancy_grid
      # docstring) - too large starts eating real walls too.
      opening_kernel_px: 3
