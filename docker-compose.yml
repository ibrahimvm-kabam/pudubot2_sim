# Reference compose file - mirrors the `docker run` command in the README.
# Adjust the floorplans path for your deployment before use.
services:
  pudubot2_sim:
    build: .
    network_mode: host
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml
      - /path/to/floorplans:/app/floorplans:ro
