[project]
name = "pudubot2_sim"
version = "0.1.0"
description = "Simulated Pudu robot implementing the pudubot2_adapter HTTP/SSE API, for testing fleet_adapter_pudu without hardware."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pudubot2_sim*"]
